; M5Stack Core2 (default) or Basic + M5Stack IMU Unit (MPU6886) on Port A,
; publishing accelerometer blocks over micro-ROS (serial transport, ROS 2 Humble).
;   pio run -e m5stack-core2 -t upload      (Core2, CP2104 -> /dev/ttyUSB*)
;   pio run -e m5stack-basic -t upload      (Basic v2.6, CH9102 -> /dev/ttyACM*)
[platformio]
default_envs = m5stack-core2

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_microros_distro = humble
board_microros_transport = serial
; m5stack_imu_msgs is built into the micro-ROS library from extra_packages/
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#2.0.0
    m5stack/M5Unified@0.2.2
build_flags =
    -DSERIAL_BAUD=921600

[env:m5stack-core2]
extends = common
board = m5stack-core2
; -DIMU_INTERNAL=1 uses the Core2's built-in MPU6886 instead of the IMU Unit on Port A

[env:m5stack-basic]
extends = common
board = m5stack-core-esp32
