; M5Stack Basic (v2.6, ESP32, no PSRAM) + M5Stack IMU Unit (MPU6886) on Port A,
; publishing accelerometer blocks over micro-ROS (serial transport, ROS 2 Humble).
[env:m5stack-basic]
platform = espressif32@6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
upload_speed = 921600

board_microros_distro = humble
board_microros_transport = serial
; m5stack_imu_msgs is built into the micro-ROS library from extra_packages/
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#2.0.0
    m5stack/M5Unified@0.2.2

build_flags =
    -DSERIAL_BAUD=921600
